[package]
name = "rust_lib_reel"
version = "2.2.0"
edition = "2021"
rust-version = "1.77.2"
description = "Reel media organizer core library"

[lib]
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
# Serialization
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Logging
log = "0.4"
env_logger = "0.11"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# UUID
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }
urlencoding = "2"

# Filesystem
dirs = "6.0"
walkdir = "2"
trash = "5"
notify = "6"

# Database
rusqlite = { version = "0.34", features = ["bundled"] }

# Text processing
regex = "1"
encoding_rs = "0.8"

# Crypto
sha2 = "0.10"

# AI (llama.cpp) -- pinned to 0.1.133 to avoid httplib/OpenSSL linker deps in newer versions
llama-cpp-2 = "=0.1.133"
llama-cpp-sys-2 = "=0.1.133"
once_cell = "1.19"

# Caching
lru = "0.12"

# Flutter Rust Bridge
flutter_rust_bridge = "=2.11.1"


[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
